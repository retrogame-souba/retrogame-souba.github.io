# ミニPCが止まっていると「相場データ更新」が動かず、失敗通知も来ない。
# そこで本番とやり直し（2:17・3:17・4:17）のあとに、GitHubのサーバー側から
# 「今日の分が更新されたか」だけを確認する。見張り自体が飛ばされても困らないよう1日2回。
# 通知は音なし（disable_notification）。
name: 更新チェック

on:
  schedule:
    - cron: "13 22 * * *"   # 日本時間 7:13
    - cron: "13 3 * * *"    # 日本時間 12:13
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: データの新しさを確認
        id: age
        run: |
          python3 - <<'EOF'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          JST = timezone(timedelta(hours=9))
          p = Path("bookoff_prices.json")
          if not p.exists():
              print("まだデータがありません（初回実行前）")
              raise SystemExit(0)
          t = datetime.fromisoformat(json.loads(p.read_text(encoding="utf-8"))["generated_at"]).astimezone(JST)
          now = datetime.now(JST)
          # 今日の2:00（日本時間）より前のデータなら、今日の更新が来ていない
          today_start = now.replace(hour=2, minute=0, second=0, microsecond=0)
          if now < today_start:
              today_start -= timedelta(days=1)
          stale = t < today_start
          print(f"最終更新: {t:%Y-%m-%d %H:%M}（日本時間） → {'未更新' if stale else 'OK'}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"last={t:%m/%d %H:%M}\n")
              f.write(f"stale={'true' if stale else 'false'}\n")
          EOF

      - name: 古ければTelegramに通知
        if: steps.age.outputs.stale == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          LAST: ${{ steps.age.outputs.last }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "disable_notification=true" \
            --data-urlencode "text=⚠️ レトロゲーム相場が今日まだ更新されていません（最終更新 ${LAST}）。ミニPCかrunnerが止まっているかもしれません。"
